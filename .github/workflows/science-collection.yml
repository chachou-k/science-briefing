name: Collect Science Articles

on:
  workflow_dispatch:
  schedule:
    # Sundays at 08:00 UTC (09:00 in German winter time, 10:00 in summer time)
    - cron: "0 8 * * 0"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect recent article candidates
        run: python collect_articles.py
